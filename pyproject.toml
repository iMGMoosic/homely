[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "homely-display"
version = "0.1.0"
description = "A Tidbyt-like LED matrix display for Raspberry Pi: clock, weather, news, transit, sports and more, configured from your phone."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Leah" }]
keywords = ["led-matrix", "raspberry-pi", "hub75", "tidbyt", "rgb-matrix"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: No Input/Output (Daemon)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "httpx>=0.27",
  "click>=8.1",
  "feedparser>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "httpx>=0.27",
  "build",
]

[project.scripts]
homely = "homely.cli:main"

[project.urls]
Homepage = "https://github.com/imgmoosic/homely"
Issues = "https://github.com/imgmoosic/homely/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/homely"]

[tool.hatch.build.targets.wheel.force-include]
"src/homely/web/static" = "homely/web/static"

[tool.hatch.build.targets.sdist]
exclude = ["web/node_modules", "dev/", "tests/", ".venv/"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TID", "RUF"]
ignore = ["RUF012", "SIM108", "B008", "UP042", "RUF009"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"src/homely/web/server.py" = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Use ctx.now() so renders are testable and timezone-aware."

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/homely"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rgbmatrix", "rgbmatrix.*", "yaml", "feedparser"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
